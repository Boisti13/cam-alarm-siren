# ESPHome substitutions for the Home Assistant entities this project
# integrates with. Included by cam-alarm-siren.yaml via
# `substitutions: !include ha_entities.yaml` — centralizes entity IDs here
# instead of hardcoding them inline.

# Incoming: ONVIF motion sensor on camera "PT2". Not defined in YAML — it's
# created by the ONVIF integration config entry (Settings > Devices &
# Services > ONVIF), which fires an ONVIF VideoSource/MotionAlarm event.
# Mirrored onto the device via the `homeassistant` binary_sensor platform,
# which directly drives the Alarm Siren switch (see binary_sensor: block) —
# no separate Home Assistant automation needed.
cam_motion_entity: binary_sensor.cam_pt2_motion_alarm
