substitutions: !include ha_entities.yaml

esphome:
  name: cam-alarm-siren
  friendly_name: Camera Alarm Siren
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(booted) = true;
          if (id(standby_indicator_enabled).state) {
            auto call = id(led).turn_on();
            call.set_rgb(id(standby_red), id(standby_green), id(standby_blue));
            call.set_brightness(id(standby_brightness));
            call.set_effect("None");
            call.perform();
          } else {
            id(led).turn_off().perform();
          }

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Confirm boot as good almost immediately, instead of the 1-minute default,
# to minimize the window in which a reset (e.g. brief power sag on the WiFi
# radio's transmit bursts) causes an OTA rollback to a much older build.
safe_mode:
  boot_is_good_after: 5s

# Enable Home Assistant API
api:
  encryption:
    key: !secret cam_alarm_siren_key
  on_client_connected:
    - lambda: |-
        if (id(standby_indicator_enabled).state) {
          auto call = id(led).turn_on();
          call.set_rgb(id(standby_red), id(standby_green), id(standby_blue));
          call.set_brightness(id(standby_brightness));
          call.set_effect("None");
          call.perform();
        } else {
          id(led).turn_off().perform();
        }

ota:
  - platform: esphome
    password: "d3ccb629166b234c572a5bf5c91d2127"

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cam Alarm Siren Fallback Hotspot"
    password: !secret ap_password

captive_portal:

globals:
  - id: in_cooldown
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: alarm_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: booted
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: standby_red
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: standby_green
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: standby_blue
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: standby_brightness
    type: float
    restore_value: yes
    initial_value: '0.15'

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO22
    channel: mono

rtttl:
  id: siren_rtttl
  speaker: echo_speaker
  gain: 80%
  on_finished_playback:
    - if:
        condition:
          switch.is_on: alarm_siren
        then:
          - rtttl.play: "alarm:d=8,o=6,b=200:c,g,c,g,c,g,c,g,c,g,c,g,c,g,c,g"

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    pin: GPIO27
    default_transition_length: 0s
    chipset: SK6812
    num_leds: 1
    rgb_order: grb
    effects:
      - pulse:
          name: "fast_pulse"
          transition_length: 100ms
          update_interval: 100ms
    on_state:
      then:
        - if:
            condition:
              lambda: "return id(booted) && !id(alarm_active) && id(standby_indicator_enabled).state;"
            then:
              - lambda: |-
                  id(standby_red) = id(led).current_values.get_red();
                  id(standby_green) = id(led).current_values.get_green();
                  id(standby_blue) = id(led).current_values.get_blue();
                  id(standby_brightness) = id(led).current_values.get_brightness();

number:
  - platform: template
    name: "Alarm Duration"
    id: alarm_duration
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 1
    max_value: 300
    step: 1
    unit_of_measurement: "s"

  - platform: template
    name: "Alarm Cooldown"
    id: alarm_cooldown
    icon: mdi:timer-sand
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 300
    step: 1
    unit_of_measurement: "s"

  - platform: template
    name: "Alarm Volume"
    id: alarm_volume
    icon: mdi:volume-high
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: |-
          id(siren_rtttl).set_gain(x / 100.0f);

switch:
  - platform: template
    name: "Alarm Siren"
    id: alarm_siren
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(alarm_active) = true;
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
          effect: "fast_pulse"
      - rtttl.play: "alarm:d=8,o=6,b=200:c,g,c,g,c,g,c,g,c,g,c,g,c,g,c,g"
      - delay: !lambda "return (uint32_t) (id(alarm_duration).state * 1000);"
      - switch.turn_off: alarm_siren
    turn_off_action:
      - rtttl.stop
      - lambda: |-
          id(alarm_active) = false;
      - if:
          condition:
            lambda: "return id(booted);"
          then:
            - lambda: |-
                if (id(standby_indicator_enabled).state) {
                  auto call = id(led).turn_on();
                  call.set_rgb(id(standby_red), id(standby_green), id(standby_blue));
                  call.set_brightness(id(standby_brightness));
                  call.set_effect("None");
                  call.perform();
                } else {
                  id(led).turn_off().perform();
                }
      - lambda: |-
          id(in_cooldown) = true;
      - delay: !lambda "return (uint32_t) (id(alarm_cooldown).state * 1000);"
      - lambda: |-
          id(in_cooldown) = false;

  - platform: template
    name: "Standby Indicator"
    id: standby_indicator_enabled
    icon: mdi:led-on
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - if:
          condition:
            lambda: "return id(booted) && !id(alarm_active);"
          then:
            - lambda: |-
                auto call = id(led).turn_on();
                call.set_rgb(id(standby_red), id(standby_green), id(standby_blue));
                call.set_brightness(id(standby_brightness));
                call.set_effect("None");
                call.perform();
    turn_off_action:
      - if:
          condition:
            lambda: "return !id(alarm_active);"
          then:
            - lambda: |-
                id(led).turn_off().perform();

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    id: echo_button
    on_press:
      - switch.turn_off: alarm_siren

  - platform: homeassistant
    id: cam_motion
    entity_id: ${cam_motion_entity}
    on_press:
      - if:
          condition:
            lambda: "return !id(in_cooldown);"
          then:
            - switch.turn_on: alarm_siren
    on_release:
      - switch.turn_off: alarm_siren

button:
  - platform: restart
    name: "Restart"
