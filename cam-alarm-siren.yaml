esphome:
  name: cam-alarm-siren
  friendly_name: Camera Alarm Siren

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: !secret cam_alarm_siren_key

ota:
  - platform: esphome
    password: "d3ccb629166b234c572a5bf5c91d2127"

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cam Alarm Siren Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
  version: 3

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO22
    channel: mono

rtttl:
  id: siren_rtttl
  speaker: echo_speaker
  on_finished_playback:
    - if:
        condition:
          switch.is_on: alarm_siren
        then:
          - rtttl.play: "alarm:d=8,o=6,b=200:c,g,c,g,c,g,c,g,c,g,c,g,c,g,c,g"

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    pin: GPIO27
    default_transition_length: 0s
    chipset: SK6812
    num_leds: 1
    rgb_order: grb
    effects:
      - pulse:
          name: "fast_pulse"
          transition_length: 100ms
          update_interval: 100ms

number:
  - platform: template
    name: "Siren Duration"
    id: siren_duration
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 300
    step: 1
    unit_of_measurement: "s"

switch:
  - platform: template
    name: "Alarm Siren"
    id: alarm_siren
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          effect: "fast_pulse"
      - rtttl.play: "alarm:d=8,o=6,b=200:c,g,c,g,c,g,c,g,c,g,c,g,c,g,c,g"
      - delay: !lambda "return (uint32_t) (id(siren_duration).state * 1000);"
      - switch.turn_off: alarm_siren
    turn_off_action:
      - rtttl.stop
      - light.turn_off:
          id: led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button"
    id: echo_button
    on_press:
      - switch.turn_off: alarm_siren

button:
  - platform: restart
    name: "Restart"
